name: tokoherbal

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di file .env}
    ports:
      # 5433 di laptop supaya tidak bentrok dengan PostgreSQL lain di port 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/seed/seed.sql:ro
    healthcheck:
      # -h 127.0.0.1 penting: saat inisialisasi, Postgres sementara hanya
      # mendengarkan lewat socket. Cek lewat TCP baru lolos setelah init.sql selesai.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # batasi memori dan buang key lama saat penuh (lihat Bab 6.1 panduan)
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di file .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    healthcheck:
      # image distroless tidak punya curl/sh, jadi biner server memeriksa dirinya sendiri
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  product-service:
    build: ./product-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432/shop_db
      # nama service dipakai sebagai host, bukan localhost (lihat panduan Bab 5.5)
      AUTH_URL: http://auth-service:8080
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Tahap 4: Redis dinyalakan. Nama service "redis" dipakai sebagai host.
      # Hapus baris REDIS_ADDR untuk menjalankan tanpa cache dan rate limit.
      REDIS_ADDR: redis:6379
      # maksimal permintaan per IP per menit (di luar /health)
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      # Rahasia bersama dengan web. Dari sisi product-service semua pengunjung web terlihat berasal dari
      # satu IP (container web), jadi panggilan server-ke-server yang membawa token ini tidak dibatasi.
      # Akses langsung ke port 8082 tanpa token tetap dibatasi.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?isi INTERNAL_TOKEN di file .env (minimal 16 karakter)}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8080"
    volumes:
      # gambar produk yang diunggah admin; tanpa volume, gambar hilang saat container dibuat ulang
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./web
    restart: unless-stopped
    environment:
      # Alamat yang dipakai SERVER Next.js (di dalam jaringan Docker): nama service, bukan localhost.
      PRODUCT_API_URL: http://product-service:8080
      AUTH_API_URL: http://auth-service:8080
      # Alamat yang dibuka BROWSER di laptop (hanya untuk gambar produk): port yang dipublikasikan di atas.
      PUBLIC_PRODUCT_URL: http://localhost:8082
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?isi INTERNAL_TOKEN di file .env (minimal 16 karakter)}
      # false karena laptop memakai http://localhost. Isi true bila nanti dilayani lewat HTTPS.
      COOKIE_SECURE: "false"
    depends_on:
      product-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      # image alpine punya wget (busybox); endpoint tidak memanggil service lain
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  uploads:
